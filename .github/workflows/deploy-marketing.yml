name: Deploy marketing site

on:
  push:
    branches:
      - master
    paths:
      - 'apps/marketing/**'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/marketing

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/marketing/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Sync to S3
        run: aws s3 sync dist/ s3://universals3client.com --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E2NABLFL93QGGP --paths "/*"
